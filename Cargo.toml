[package]
name = "sparrowhawk"
version = "0.1.2"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
ahash = { version = "=0.8.11" }
num-traits = { version = "0.2.19" }
log = { version = "0.4.27" }
clap = { version = "4.5.35", features = ["derive"] }
regex = { version = "1.11.1" }
rayon = { version = "1.10.0" }
num_cpus = { version = "1.16.0" }
nohash-hasher = { version = "0.2.0" }
stacker = { version = "0.1.20" }
project-root = { version = "0.2.2" }
petgraph = { version = "0.8.1" }
sparrowhawk-graph = { git = "https://github.com/bacpop/sparrowhawk-graph.git", branch = "master" }
bnum = { version = "0.13.0", features = ["serde", "numtraits"] }
argmin = { version = "0.10.0", features = ["wasm-bindgen"] }
argmin-math = { version = "0.4" }
argmin-observer-slog = { version = "0.1.0" }
libm = { version = "0.2" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
needletail = { version = "0.6.3", default-features = false, features = ["flate2", "xz2", "zstd"] }
indicatif = { version = "0.17.11", features = ["rayon"] }
plotters = { version = "0.3.7", features = ["ab_glyph"] }
fern = { version = "0.7.1" }
humantime = { version = "2.2.0" }

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = { version = "0.3.51" }
wasm-bindgen = { version = "0.2" }
simple-error = { version = "0.2" }
console_error_panic_hook = { version = "0.1.7" }
wasm-bindgen-file-reader = { version = "1" }
seq_io = { version = "0.3.2" }
flate2 = { version = "1.0" }
getrandom = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3.77", features = ["Blob", "console", "Document", "Element", "HtmlCanvasElement", "HtmlImageElement", "Response", "Window"] }
json = { version = "0.12.4" }

[dev-dependencies]
# testing
pretty_assertions = "1.4.1"
stacker = "0.1.20"


[profile.release]
lto = true

[rust]
lld = true

#[patch."https://github.com/bacpop/sparrowhawk-graph.git"]
#sparrowhawk-graph = { path = "../../../sparrowhawk-graph" }
