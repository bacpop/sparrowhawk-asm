[package]
name = "sparrowhawk"
version = "0.1.2"
edition = "2021"

# [features]
# default = ["basic"]
# wasm = ["js-sys", "wasm-bindgen", "simple-error", "console_error_panic_hook", "wasm-bindgen-file-reader", "seq_io", "flate2", "web-sys", "getrandom",
#         "serde", "ahash", "num-traits", "log", "clap", "regex", "rayon", "num_cpus", "nohash-hasher",
#         "stacker", "project-root", "bnum", "json", "argmin", "argmin-math", "argmin-observer-slog", "libm",
#         "wasm-bindgen-futures"]
#
# basic = ["needletail", "serde", "ahash", "num-traits", "log", "indicatif", "clap", "regex", "rayon", "num_cpus", "nohash-hasher",
#          "stacker", "plotters", "project-root", "bnum", "argmin", "argmin-math", "argmin-observer-slog", "libm", "fern", "humantime"]

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu  = "28.0"
tokio = { version = "1.49.0", features = ["full"] }
#sphk-graph = { path = "../sphk-graph" }
sphk-graph = { git = "https://github.com/vrbouza/sphk-graph.git", branch = "master" }

# i/o
needletail = { version = "0.6.3", default-features = false, features = ["flate2", "xz2", "zstd"]}
serde = { version = "1.0.219", features = ["derive"]}
# data structures
ahash = {version = "=0.8.11"}
num-traits = {version = "0.2.19"}
# logging
log = {version = "0.4.27"}

fern = { version = "0.7.1"}
humantime = { version = "2.2.0"}
indicatif = { version = "0.17.11", features = ["rayon"]}

# cli
clap = { version = "4.5.35", features = ["derive"]}
regex = {version = "1.11.1"}
# parallelisation
rayon = {version = "1.10.0"}
num_cpus = {version = "1.16.0"}

nohash-hasher = {version = "0.2.0"}
stacker = {version = "0.1.20"}
# statistical = "1.0.0"

plotters = {version = "0.3.7"}
project-root = {version = "0.2.2"}
# petgraph is used directly in algorithm files (inner_graph access, tarjan_scc, connected_components)
petgraph = "0.8.1"

bnum = {version = "0.13.0", features = ["serde", "numtraits"]}

bytemuck = "*"
flume = "*"
futures-channel = "0.3"
argmin                   = {version = "0.10.0"}
argmin-math              = {version = "0.4"}
argmin-observer-slog     = {version = "0.1.0"}
libm                     = {version = "0.2"}

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu  = { version = "28.0", features = ["webgpu"] }
petgraph = "0.8.1"
sphk-graph = { git = "https://github.com/vrbouza/sphk-graph.git", branch = "master" }
futures-channel = "0.3"
# WebAssembly
js-sys                   = {version = "0.3.51"}
wasm-bindgen             = {version = "0.2"   }
simple-error             = {version = "0.2"   }
console_error_panic_hook = {version = "0.1.7" }
wasm-bindgen-file-reader = {version = "1"     }
seq_io                   = {version = "0.3.2" }
flate2                   = {version = "1.0"   }
getrandom                = {version = "0.2"   , features = ["js"]}
web-sys                  = {version = "0.3.77", features = ["Blob", "console", "Document", "Element", "HtmlCanvasElement", "HtmlImageElement", "Response", "Window"]}
json                     = {version = "0.12.4"}
# argmin                   = {version = "0.10.0", optional = true, features = ["slog-logger", "wasm-bindgen"]}
argmin                   = {version = "0.10.0", features = ["wasm-bindgen"]}
argmin-math              = {version = "0.4"}
argmin-observer-slog     = {version = "0.1.0"}
libm                     = {version = "0.2"}
wasm-bindgen-futures     = {version = "0.4"}
rand_chacha              = "0.3.1"
serde = { version = "1.0.219", features = ["derive"]}
ahash = {version = "=0.8.11"}
num-traits = {version = "0.2.19"}
log = {version = "0.4.27"}
clap = { version = "4.5.35", features = ["derive"]}
regex = {version = "1.11.1"}
rayon = {version = "1.10.0"}
num_cpus = {version = "1.16.0"}
nohash-hasher = {version = "0.2.0"}
stacker = {version = "0.1.20"}
project-root = {version = "0.2.2"}
bnum = {version = "0.13.0", features = ["serde", "numtraits"]}
bytemuck = "*"



[dev-dependencies]
# testing
pretty_assertions = "1.4.1"
stacker = "0.1.20"


[profile.release]
lto = true

[rust]
lld = true
