[package]
name = "sparrowhawk-asm"
version = "0.1.3"
edition = "2021"
repository = "https://github.com/bacpop/sparrowhawk-asm"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true

[features]
default = ["xz2", "zstd"]
xz2 = ["needletail/xz2"]
zstd = ["needletail/zstd"]

# Dependencies =======================================================
# - Common
[dependencies]
num-traits = { version = "0.2.19" }
log = { version = "0.4.27" }
rayon = { version = "1.10.0" }
nohash-hasher = { version = "0.2.0" }
sparrowhawk-graph = { git = "https://github.com/bacpop/sparrowhawk-graph.git", rev = "93d19ae2138640752796415a9f76db437fbc9179" }
bnum = { version = "0.13.0", features = ["numtraits"] }
libm = { version = "0.2" }
# The spectrum fit runs on both targets. `wasm-bindgen` is added per-target below: on native it would
# pull `getrandom/js`, whose backend is wasm-only.
argmin = { version = "0.10.0", default-features = false }
argmin-math = { version = "0.4" }

# - Per target
[target.'cfg(not(target_family = "wasm"))'.dependencies]
clap = { version = "4.5.35", features = ["derive"] }
needletail = { version = "0.7.3", default-features = false, features = ["flate2"] }
plotters = { version = "0.3.7", default-features = false, features = ["ab_glyph", "bitmap_backend", "bitmap_encoder", "svg_backend", "line_series"] }

[target.'cfg(target_family = "wasm")'.dependencies]
argmin = { version = "0.10.0", default-features = false, features = ["wasm-bindgen"] }
js-sys = { version = "0.3.51" }
wasm-bindgen = { version = "0.2" }
console_error_panic_hook = { version = "0.1.7" }
wasm-bindgen-file-reader = { version = "1" }
seq_io = { version = "0.3.2" }
flate2 = { version = "1.0" }
getrandom = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3.77", features = ["Blob", "File"] }
json = { version = "0.12.4" }

# - Testing
[dev-dependencies]
pretty_assertions = "1.4.1"
